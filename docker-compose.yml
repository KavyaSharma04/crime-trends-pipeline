services:
  postgres:
    image: postgres:16
    container_name: crime_trends_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crime_trends
      POSTGRES_USER: crime_user
      POSTGRES_PASSWORD: local_crime_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crime_user -d crime_trends"]
      interval: 10s
      timeout: 5s
      retries: 5
  metabase:
    image: metabase/metabase:latest
    container_name: crime_trends_metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: